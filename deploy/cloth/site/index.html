2. 霞帔：前胸正中垂下一条宽带，从领下一直垂到接近地面，末端收成尖角；宽带为金色地，满饰五彩云纹和龙形蟒纹，下段为海水江崖纹；尖角末端悬挂一枚金色水滴形坠子。
3. 内袍：金色地五彩织纹袍，在大衫的领口、胸前和两侧下摆露出，可见青绿色蟒纹。
4. 领口有白色护领。
5. 腰前垂下一条白色长带。
【禁止出现】清代马蹄袖、盘扣、清式大襟立领、背心式霞帔、云肩、旗装、唐代齐胸襦裙、日式和服元素、拉链和现代纽扣；大衫上不能有刺绣图案；红色不能偏橙或偏粉。`;
const SPEC_EN=`[Subject] Historical reconstruction of a Ming dynasty (Wanli era) noblewoman's ceremonial court dress, based on the portrait of Lady Shi, wife of the Marquis of Linhuai, in the National Museum of China.
[Presentation] The garments are displayed on a headless white dress form, plain light-grey background, museum reconstruction plate style, realistic silk texture, soft even lighting, full length in frame. No person, no text, no watermark, no chair or carpet.
[Garment structure, outer to inner]
1. Outer robe (dashan): plain true-red silk with no pattern at all; centre-front opening edged with a thin gold trim; extremely wide hanging sleeves reaching below the knees; floor length.
2. Xiapei stole: a single wide band hanging down the centre front from below the collar almost to the floor, ending in a point; gold ground densely decorated with multicoloured clouds and dragon-like python (mang) motifs, with sea-wave-and-cliff pattern on the lower part; a gold teardrop-shaped pendant hangs from the pointed end.
3. Inner robe: gold-ground robe woven with multicoloured patterns and blue-green python motifs, visible at the collar, chest and both lower sides.
4. White inner collar band.
5. A long white sash hanging from the front waist.
[Must not appear] Qing-dynasty horse-hoof cuffs, frog buttons, Qing-style side-fastening standing collar, vest-shaped xiapei, cloud collar, Manchu robes, Tang high-waisted skirts, Japanese kimono elements, zips or modern buttons; no embroidery on the red outer robe; the red must not drift to orange or pink.`;
const VIEW_ZH={front:"【视角】正面，人台正对镜头。",side:"【视角】右侧90度侧面，表现宽大垂袖的垂坠和霞帔的厚度。",back:"【视角】背面。大衫背部为素红无纹。霞帔在背后的形制画像中不可见，属于推测：表现为两条较窄的金地带子从后颈垂至背部中段。"};
const VIEW_EN={front:"[View] Front view, dress form facing the camera.",side:"[View] Right side view at 90 degrees, showing the drape of the wide sleeves.",back:"[View] Back view. The back of the red robe is plain. The back of the xiapei is not visible in the portrait and is conjectural: render it as two narrower gold bands hanging from the back of the neck to mid-back."};

/* ============ 提示词组装 ============ */
function specChangesText(lang){
  if(!S.spec.changes.length) return "";
  const lines=S.spec.changes.map((c,i)=>`${i+1}. ${c.field?c.field+" ":""}${c.change}`).join("\n");
  return lang==="en" ? `\n[Revisions from expert review — apply these]\n${lines}` : `\n【专家评审修订，必须执行】\n${lines}`;
}
function buildPrompt(group,model,view){
  const en=MODELS[model].lang==="en";
  const spec=en?SPEC_EN:SPEC_ZH, vw=(en?VIEW_EN:VIEW_ZH)[view];
  if(group==="E0") return en?"Ming dynasty noblewoman's ceremonial dress reconstruction, full length, front view":"明代命妇礼服复原图，全身，正面";
  if(group==="E1") return `${spec}\n${vw}`;
  if(group==="E2"){
    if(view==="front") return (en?"The reference image is the portrait of Lady Shi, wife of the Marquis of Linhuai (Ming dynasty), National Museum of China. Strictly following the garments worn in the portrait, reconstruct them as a real garment photographed on a headless white dress form. Keep the colours, pattern layout and layering of the garments in the portrait; do not copy the person, face, headdress, chair, carpet or background.\n":"参考图是中国国家博物馆藏《李言恭配临淮侯夫人史氏像》。请严格依据画像中人物所穿的服装，把它复原成穿在无头白色人台上的实物服装照片。保留画像中服装的颜色、纹样布局和各层的相对位置；不要复制画像中的人物、面部、冠饰、椅子、地毯和背景。\n")+`${spec}\n${vw}`;
    return (en?`The reference image is the front view of the same reconstructed garment. Keep exactly the same garment, colours and patterns and generate its ${view==="side"?"right side view at 90 degrees":"back view"}.\n`:`参考图是同一件复原服装的正面图。请保持完全相同的服装、颜色和纹样，生成它的${VIEWN[view]}。\n`)+`${spec}\n${vw}`;
  }
  if(group==="E3"){
    const ch=specChangesText(en?"en":"zh")||(en?"\n[Revisions] (accept an expert review first in step 4)":"\n【修订内容】（请先在第④步采纳专家评审意见）");
    return (en?"The reference image is the previous version of this reconstruction. Make only the changes listed below and keep everything else the same.\n":"参考图是上一版复原结果。请只做下列修改，其他部分保持不变。\n")+`${spec}${ch}\n${vw}`;
  }
  return en?"The reference image is a reconstructed Ming dynasty noblewoman's ceremonial dress. Generate a realistic full-length photo of a fictional young Chinese woman (not any real person) wearing exactly this garment, standing in a museum gallery. Colours, patterns and structure must match the reference. No headdress; a simple Ming-style hair bun. No text."
   :"参考图是一件明代命妇礼服复原件。请生成一位虚构的中国年轻女性（不是任何真实人物）身穿这件服装、站在博物馆展厅中的全身写实照片。服装的颜色、纹样和结构必须与参考图一致。不要冠饰，发型为简单的明式发髻。不要文字。";
}
function refsFor(group,view){
  if(group==="E2") return view==="front"?"上传参考图：国博画像（史氏像_国博官网.jpg），可加局部_02、局部_03":"上传参考图：E2 正面最佳结果";
  if(group==="E3") return "上传参考图：第⑤步选出的最佳 V1 结果";
  if(group==="E4") return "上传参考图：E2 或 E3 正面最佳结果（不要上传真人照片）";
  return "不需要参考图";
}

/* ============ 评分工具 ============ */
function effScores(r){const out={};const ai=r.review?.scores||[];for(const c of CRIT){const a=ai.find(x=>x.id===c[0]);out[c[0]]=r.override?.[c[0]]??(a?Number(a.score):null)}return out}
function total(r){const s=effScores(r);const v=Object.values(s);if(v.some(x=>x==null))return null;return v.reduce((a,b)=>a+b,0)}
function imgSrc(r){return S.local[r.id]?.url||(r.assetId?"/_blob/"+r.assetId:"")}
function runLabel(r){return `${r.group} · ${MODELS[r.model]?.name||r.model} · ${VIEWN[r.view]||r.view}`}

/* ============ 渲染：流程条与依据栏 ============ */
function stepDone(id){
  if(id==="source")return true;
  if(id==="spec")return S.spec.confirmed;
  if(id==="generate")return S.runs.length>0;
  if(id==="review")return S.runs.some(r=>r.review);
  if(id==="compare")return S.runs.some(r=>r.selected);
  if(id==="revise")return S.spec.changes.length>0;
  if(id==="final")return !!S.final;
}
function renderSteps(){
  $("#steps").innerHTML=STEPS.map(s=>`<a href="#${s.id}" class="${s.id===S.step?"on":""} ${stepDone(s.id)&&s.id!==S.step?"done":""}"><span class="n">${stepDone(s.id)&&s.id!==S.step?"✓":s.n}</span>${s.t}${s.ex?'<span class="ex">专家</span>':""}</a>`).join("");
}

  ${S.spec.changes.length?`<p class="note" style="margin-top:8px">V2 修订 ${S.spec.changes.length} 条，见第⑥步</p>`:""}`;
}
function drawCrops(){
  const img=$("#portrait");
  const go=()=>{$("#crops").innerHTML="";for(const [t,x,y,w,h] of CROPS){const c=document.createElement("canvas");c.width=w*2;c.height=h*2;c.title=t;c.setAttribute("aria-label","局部："+t);c.getContext("2d").drawImage(img,x,y,w,h,0,0,w*2,h*2);$("#crops").append(c)}};
  img.complete?go():img.addEventListener("load",go,{once:true});
}

   ${rv.forbidden?.length?`<p class="alert">禁用元素：${rv.forbidden.map(f=>esc(f.item+(f.where?"（"+f.where+"）":""))).join("；")}</p>`:'<p class="alert info">未发现禁用元素</p>'}
   <p><b>结论：</b>${esc(rv.summary)}</p><p class="note">评审人：${esc(rv.reviewer||"Claude（模拟专家）")} · ${rv.at?new Date(rv.at).toLocaleString("zh-CN"):""}；点分数可由真人专家改判</p>
   ${rv.revisions?.length?`<div><b>修订建议</b><ol style="margin:4px 0 0;padding-left:20px">${rv.revisions.map(x=>`<li><b>${esc(x.field||"")}</b> ${esc(x.change)} <span class="note">— ${esc(x.reason||"")}</span></li>`).join("")}</ol></div>`:""}
   <div class="formrow">${rv.revisions?.length?`<button class="btn" data-act="adopt">采纳修订，生成 V2 规格</button>`:""}<button class="btn ${r.selected?"":"ok"}" data-act="toggleSel">${r.selected?"取消选择":"选为最佳候选"}</button></div>
  </div>`:""}
 </section>
</div>`;
};

V.compare=()=>{
  const rows=Object.keys(GROUPS), cols=Object.keys(MODELS);
  const best=(g,m)=>{const xs=S.runs.filter(r=>r.group===g&&r.model===m&&total(r)!=null);return xs.length?xs.reduce((a,b)=>total(b)>total(a)?b:a):null};
  const avg=(g,m)=>{const xs=S.runs.filter(r=>r.group===g&&r.model===m&&total(r)!=null).map(total);return xs.length?(xs.reduce((a,b)=>a+b,0)/xs.length):null};
  const forb=(m)=>S.runs.filter(r=>r.model===m&&r.review?.forbidden?.length).length;
  let top=null;for(const r of S.runs){if(total(r)!=null&&(!top||total(r)>total(top)))top=r}
  return `
<div class="head"><div><h2>⑤ 对比选择</h2><p>按实验组 × 模型汇总平均分（满分 20），绿色为该组最高；点格子查看对应最佳图。</p></div></div>
<section class="card"><div class="scroll"><table class="matrix"><thead><tr><th>实验组</th>${cols.map(m=>`<th>${MODELS[m].name}</th>`).join("")}</tr></thead><tbody>
${rows.map(g=>{const vals=cols.map(m=>avg(g,m));const mx=Math.max(...vals.filter(v=>v!=null));return `<tr><td><b>${GROUPS[g].t}</b></td>${cols.map((m,i)=>{const v=vals[i];const b=best(g,m);return `<td class="${v!=null&&v===mx?"best":""}">${v==null?'<span class="note">—</span>':`<div class="cell" ${b?`data-run="${b.id}" role="button" tabindex="0"`:""}><span class="score">${v.toFixed(1)}</span><span class="cbar"><i style="width:${v/20*100}%"></i></span></div>`}</td>`}).join("")}</tr>`}).join("")}
<tr><td class="muted">出现禁用元素的图（张）</td>${cols.map(m=>`<td class="mono">${forb(m)}</td>`).join("")}</tr></tbody></table></div></section>
<section class="card"><h2>已选最佳候选</h2>${S.runs.filter(r=>r.selected).length?`<div class="gallery">${S.runs.filter(r=>r.selected).map(shotCard).join("")}</div>`:`<div class="empty">${top?`目前得分最高：${esc(runLabel(top))}（${total(top)}/20）。在第④步点“选为最佳候选”。`:"评审完成后在这里选出最佳候选。"}</div>`}</section>`;
};

V.revise=()=>{
  const v1=S.runs.filter(r=>r.selected&&r.group!=="E3").sort((a,b)=>(total(b)??0)-(total(a)??0))[0];
  const v2=S.runs.filter(r=>r.group==="E3"&&total(r)!=null).sort((a,b)=>total(b)-total(a))[0];
  return `
<div class="head"><div><h2>⑥ 修订 V2</h2><p>专家意见写回规格书，形成 V2；用 V1 最佳图作参考重新生成（E3 组），再评审比较。</p></div></div>
<section class="card"><h2>规格书 V1 → V2</h2>${S.spec.changes.length?`<ol class="diff">${S.spec.changes.map((c,i)=>`<li><b>${esc(c.field||"")}</b> ${esc(c.change)} <span class="note">— ${esc(c.reason||"")}</span> <button class="btn sm" data-del="${i}">删除</button></li>`).join("")}</ol>
<div class="formrow" style="margin-top:8px"><a class="btn pri" href="#generate" data-act="goE3">用 V2 生成 E3 →</a></div>`:`<div class="empty">还没有修订。请在第④步对评审结果点“采纳修订，生成 V2 规格”。</div>`}
<div class="formrow" style="margin-top:12px"><label class="f" style="flex:1;min-width:240px">手动补充一条修订<input id="manualRev" placeholder="例如：F5 霞帔云纹加密，蟒纹位于胸前与膝前两处"></label><button class="btn" data-act="addRev">添加</button></div></section>
<section class="card"><h2>V1 与 V2 对比</h2>${v1||v2?`<div class="vs">
 <figure>${v1&&imgSrc(v1)?`<img src="${imgSrc(v1)}" alt="V1">`:'<div class="empty">V1 最佳候选待选</div>'}<figcaption><b>V1</b> ${v1?esc(runLabel(v1))+" · "+(total(v1)??"—")+"/20":""}</figcaption></figure>
 <figure>${v2&&imgSrc(v2)?`<img src="${imgSrc(v2)}" alt="V2">`:'<div class="empty">E3 结果待上传并评审</div>'}<figcaption><b>V2</b> ${v2?esc(runLabel(v2))+" · "+total(v2)+"/20":""}</figcaption></figure></div>
 ${v1&&v2?`<p style="margin-top:10px"><b>变化：</b>${total(v2)-total(v1)>=0?"+":""}${total(v2)-(total(v1)??0)} 分</p>`:""}`:`<div class="empty">选出 V1 最佳候选并完成 E3 评审后在此对比。</div>`}</section>`;
};

V.final=()=>{
  const cands=S.runs.filter(r=>r.selected||r.group==="E3").filter(r=>total(r)!=null);
  const f=S.final, fr=f&&S.runs.find(r=>r.id===f.runId);
  return `
<div class="head"><div><h2>⑦ 定稿存证</h2><p>专家签署定稿：对图像、规格书版本和评审记录计算哈希并留存，生成数字资产卡。</p></div><span class="sp"></span><span class="pill expert">专家节点 ④ 签名定稿 · ⑤ 授权等级</span></div>
${f&&fr?`<section class="card"><div class="two" style="align-items:start">
 <div class="stage">${imgSrc(fr)?`<img src="${imgSrc(fr)}" alt="定稿图">`:""}</div>
 <div style="display:grid;gap:10px"><h2 style="font-family:var(--f-display);font-size:20px">明 · 临淮侯夫人命妇礼服复原</h2>
  <dl class="kv"><dt>资产ID</dt><dd class="mono">${esc(f.assetNo)}</dd><dt>依据文物</dt><dd>《李言恭配临淮侯夫人史氏像》· 国博藏</dd><dt>定稿版本</dt><dd>规格书 ${esc(f.specVersion)} · ${esc(runLabel(fr))}</dd><dt>评审得分</dt><dd>${esc(f.score)}/20</dd><dt>签署</dt><dd>${esc(f.signer)} · ${new Date(f.signedAt).toLocaleString("zh-CN")}</dd><dt>授权等级</dt><dd>${esc(f.license)}</dd></dl>
  <div><b>存证哈希</b> <span class="note">SHA-256（演示；正式环境为国密 SM3，国博与咪咕双节点见证）</span><div class="hash">${esc(f.hash)}</div></div>
  <div class="formrow"><button class="btn sm" data-act="verify">校验哈希</button><button class="btn sm warn" data-act="unfinal">撤销定稿</button></div><p class="note" id="verifyOut"></p></div></div></section>`
:`<section class="card" style="display:grid;gap:12px">${cands.length?`
 <div class="formrow"><label class="f" style="min-width:260px">定稿候选<select id="finRun">${cands.map(r=>`<option value="${r.id}">${esc(runLabel(r))} · ${total(r)}/20</option>`).join("")}</select></label>
 <label class="f">签署专家<input id="finSigner" value="服饰史专家（演示）" size="18"></label>
 <label class="f">授权等级<select id="finLic"><option>仅内部研究</option><option selected>可对外展示</option><option>可商业授权</option></select></label>
 <button class="btn ok" data-act="sign">签署定稿</button></div>`:`<div class="empty">需要至少一张已评审并选为最佳候选（或 E3 修订版）的图。</div>`}</section>`}`;
};

/* ============ 主渲染与事件 ============ */
function render(){
  const id=(location.hash||"#source").slice(1);S.step=STEPS.some(s=>s.id===id)?id:"source";
  renderSteps();renderRefSpec();$("#main").innerHTML=V[S.step]();bindDrop();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-group],[data-model],[data-view],[data-act],[data-run],[data-score],[data-del]");if(!t)return;
  if(t.dataset.group){S.group=t.dataset.group;render()}
  else if(t.dataset.model){S.model=t.dataset.model;render()}
  else if(t.dataset.view){S.view=t.dataset.view;render()}
  else if(t.dataset.run){S.sel=t.dataset.run;location.hash="#review";if(S.step==="review")render()}
  else if(t.dataset.score){const [c,n]=t.dataset.score.split(":");const r=S.runs.find(x=>x.id===S.sel);if(r){r.override={...(r.override||{}),[c]:+n};await save(r);render()}}
  else if(t.dataset.del!=null){S.spec.changes.splice(+t.dataset.del,1);await saveSpec();render()}
  else act(t.dataset.act,t,e);
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[role=button]")){e.preventDefault();e.target.click()}});
document.addEventListener("change",e=>{if(e.target.id==="pickRun"){S.sel=e.target.value;render()}if(e.target.id==="file")handleFiles(e.target.files)});

async function copyPrompt(){const txt=$("#promptText")?.textContent||"";try{await navigator.clipboard.writeText(txt);toast("提示词已复制")}catch{const r=document.createRange();r.selectNodeContents($("#promptText"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("请按 Ctrl+C 复制已选中的提示词")}}
async function act(a,t,e){
  if(a==="copy")copyPrompt();
  if(a==="openModel")copyPrompt();
  if(a==="confirmSpec"){S.spec.confirmed=true;S.spec.confirmedAt=Date.now();await saveSpec();toast("规格书已由专家确认");render()}
  if(a==="review")runReview();
  if(a==="stop")S.ctl?.abort();
  if(a==="adopt"){const r=S.runs.find(x=>x.id===S.sel);for(const x of r.review.revisions||[])S.spec.changes.push({field:x.field,change:x.change,reason:x.reason,fromRun:r.id});S.spec.version="V2";await saveSpec();toast("已写入 V2 规格书");render()}
  if(a==="addRev"){const v=$("#manualRev").value.trim();if(!v)return;const m=v.match(/^(F\d+)\s*/);S.spec.changes.push({field:m?m[1]:"",change:m?v.slice(m[0].length):v,reason:"专家手动补充"});S.spec.version="V2";await saveSpec();render()}
  if(a==="goE3"){S.group="E3";S.view="front"}
  if(a==="toggleSel"){const r=S.runs.find(x=>x.id===S.sel);r.selected=!r.selected;await save(r);toast(r.selected?"已选为最佳候选":"已取消");render()}
  if(a==="sign")sign();
  if(a==="verify")verify();
  if(a==="unfinal"){S.final=null;if(db)try{await db.doc("meta/final").delete()}catch{};render()}
}

/* ============ 上传 ============ */
function bindDrop(){const d=$("#drop");if(!d)return;
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over")}));
  d.addEventListener("drop",e=>handleFiles(e.dataTransfer.files));}
function parseName(n){const m=n.match(/(E[0-4])_(nb2|nbpro|sd|gpt|qwen)_(front|side|back)/i);if(!m)return null;return {group:m[1].toUpperCase(),model:m[2].toLowerCase()==="nbpro"?"nb2":m[2].toLowerCase(),view:m[3].toLowerCase(),variant:m[2].toLowerCase()==="nbpro"?"Nano Banana Pro":""}}
async function handleFiles(files){
  for(const f of files){
    if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast(`${f.name}：只支持 PNG、JPG、WebP`);continue}
    const p=parseName(f.name)||{group:$("#upGroup").value,model:$("#upModel").value,view:$("#upView").value,variant:""};
    const id=`${p.group}_${p.model}_${p.view}_${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}`;
    const r={id,group:p.group,model:p.model,view:p.view,variant:p.variant||$("#upVariant").value.trim(),durationSec:+$("#upSec").value||null,fileName:f.name,createdAt:Date.now(),specVersion:S.spec.version,assetId:null,selected:false};
    S.local[id]={file:f,url:URL.createObjectURL(f)};
    if(assets){try{const up=await assets.upload(f);r.assetId=up.id}catch(err){toast(`${f.name} 未能保存到云端（${err.code||"error"}），本次会话内可用`)}}
    S.runs.push(r);await save(r);
  }
  toast(`已上传 ${files.length} 张`);S.group=S.runs.at(-1)?.group||S.group;render();
}

/* ============ AI 专家评审 ============ */
async function blobOf(r){if(S.local[r.id]?.file)return S.local[r.id].file;if(r.assetId){const res=await fetch("/_blob/"+r.assetId);if(res.ok)return await res.blob()}throw {code:"no_image",message:"找不到这张图的文件"}}
function reviewPrompt(r){
  const specTxt=SPEC.map(f=>`${f[0]} ${f[1]}：${f[2]}（${LV[f[3]]}；依据：${f[4]}）`).join("\n");
  const ch=S.spec.changes.length?"\n规格书 V2 修订：\n"+S.spec.changes.map(c=>`- ${c.field} ${c.change}`).join("\n"):"";
  return `你是中国古代服饰史专家，熟悉明代命妇冠服制度，正在为中国国家博物馆审核一张 AI 复原候选图。
图1：国博藏《李言恭配临淮侯夫人史氏像》（明），这是复原依据。图2：候选复原图（实验组 ${r.group}，${GROUPS[r.group].t}；模型 ${MODELS[r.model].name}；应为${VIEWN[r.view]}视角${r.group==="E4"?"；这是虚构人物穿着复原服装的合拍图":"；服装应穿在无头白色人台上"}）。

形制规格书：
${specTxt}${ch}

请逐项评分（0=不符合，1=部分符合，2=符合）。只依据图2中能看到的内容评分；该视角下看不到的部位（如背面看不到前胸垂带），按“是否与规格书矛盾”评分，不矛盾给1分并在理由中说明“该视角不可见”。
${CRIT.map(c=>`${c[0]} ${c[1]}（对应 ${c[2]}）`).join("\n")}

另外检查禁用元素（F12）是否出现，给出图2上问题位置的标注（x、y 为相对图2宽高的百分比，0–100），并给出结论：
- “通过”：总分≥16 且无禁用元素；
- “退回改规格书”：问题源于规格书描述不清或与画像不一致；
- “重新生成”：规格书清楚但模型没做到。
修订建议写成可直接写入规格书的句子，每条注明字段编号。

只回复一个 JSON 对象，格式如下，不要其他文字：
{"scores":[{"id":"C1","score":2,"reason":"简短理由"}],"forbidden":[{"item":"盘扣","where":"前襟"}],"view_ok":true,"completeness":2,"annotations":[{"x":52,"y":40,"label":"问题说明","severity":"error"}],"verdict":"重新生成","summary":"两三句总体评价","revisions":[{"field":"F5","change":"修订后的描述","reason":"原因"}]}
severity 取 error（错误）、doubt（存疑）或 ok（亮点）。scores 必须包含 C1 到 C10 全部十项。`;
}
async function runReview(){
  const r=S.runs.find(x=>x.id===S.sel);if(!r||!sample)return;
  S.busy=true;S.ctl=new AbortController();render();
  try{
    if(!sampleImgs)throw {code:"images_unavailable"};
    const imgs=[portraitBlob||await (await fetch("shi.jpg")).blob(),await blobOf(r)];
    const out=await sample.json(reviewPrompt(r),{images:imgs,signal:S.ctl.signal,cache:false,onText:({text})=>{const el=$("#stream");if(el){el.textContent=text;el.scrollTop=el.scrollHeight;$("#streamHead").textContent="专家正在写评审意见…"}}});
    if(!out||!Array.isArray(out.scores))throw {code:"invalid_json"};
    out.at=Date.now();out.reviewer="Claude（模拟专家）";r.review=out;r.override={};await save(r);toast("评审完成");
  }catch(err){
    const msg={not_granted:"未授权本页面使用 Claude，可手动打分。",images_unavailable:"当前环境不能发送图片给 AI 专家。",rate_limited:"调用太频繁，请稍后再试。",invalid_json:"评审结果格式不完整，请重新评审。",cancelled:"已停止。",no_image:"找不到这张图的文件，请重新上传。",refused:"AI 专家拒绝评审这张图，请换一张。",session_expired:"登录已过期，请重新登录 claude.ai。"}[err.code]||"评审失败，请重试。";
    toast(msg);
  }finally{S.busy=false;render()}
}

/* ============ 定稿与哈希 ============ */
function stable(v){if(Array.isArray(v))return "["+v.map(stable).join(",")+"]";if(v&&typeof v==="object")return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}";return JSON.stringify(v)}
async function digest(r,meta){const b=await blobOf(r);const buf=new Uint8Array(await b.arrayBuffer());const extra=new TextEncoder().encode(stable(meta));const all=new Uint8Array(buf.length+extra.length);all.set(buf);all.set(extra,buf.length);const h=await crypto.subtle.digest("SHA-256",all);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function sign(){
  const r=S.runs.find(x=>x.id===$("#finRun").value);
  const meta={runId:r.id,specVersion:r.specVersion||S.spec.version,changes:S.spec.changes,scores:effScores(r),signer:$("#finSigner").value.trim()||"服饰史专家",license:$("#finLic").value};
  try{const hash=await digest(r,meta);S.final={...meta,hash,score:total(r),signedAt:Date.now(),assetNo:"YG-2026-B-"+String(Date.now()).slice(-4)};if(db)await db.doc("meta/final").set(S.final);toast("已签署定稿并存证");render()}catch(err){toast("签署失败："+(err.message||err.code||"未知错误"))}
}
async function verify(){const f=S.final,r=S.runs.find(x=>x.id===f.runId);try{const {hash,score,signedAt,assetNo,...meta}=f;const h=await digest(r,meta);$("#verifyOut").textContent=h===f.hash?"✓ 哈希一致：图像与记录未被改动":"✕ 哈希不一致：图像或记录已被改动"}catch{$("#verifyOut").textContent="无法读取图像文件"}}

/* ============ 存储 ============ */
async function save(r){if(!db)return;try{await db.doc("runs/"+r.id).set(JSON.parse(JSON.stringify(r)))}catch(err){toast("保存失败："+(err.code||""))}}
async function saveSpec(){if(!db)return;try{await db.doc("meta/spec").set(JSON.parse(JSON.stringify(S.spec)))}catch{}}

/* ============ 启动 ============ */
render();drawCrops();
fetch("shi.jpg").then(r=>r.blob()).then(b=>portraitBlob=b).catch(()=>{});
(async()=>{
  const w=window.claude; if(!w?.use){$("#envState").textContent="离线模式 · 结果仅保存在本次浏览";return}
  [db,assets,sample]=await Promise.all(["db","assets","sample"].map(n=>w.use(n).catch(()=>null)));
  if(sample){try{sampleImgs=!!(await sample.limits()).images}catch{sampleImgs=false}}
  $("#envState").textContent=[db?"存储已连接":"存储未连接",assets?"图片可云端保存":"图片仅本次可用",sample?(sampleImgs?"AI专家可用":"AI专家不可看图"):"AI专家不可用"].join(" · ");
  if(db){
    db.collection("runs").orderBy("createdAt").onSnapshot(s=>{S.runs=s.docs.map(d=>({...d.data(),id:d.id}));render()},()=>{});
    db.doc("meta/spec").onSnapshot(d=>{if(d.exists){S.spec={...S.spec,...d.data(),changes:[...(d.data().changes||[])]};render()}},()=>{});
    db.doc("meta/final").onSnapshot(d=>{S.final=d.exists?{...d.data()}:null;render()},()=>{});
  }
})();
</script>

</body></html>
